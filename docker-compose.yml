# SYNAPSE 运行编排（赛题 M10）。默认离线自检；真实实验经 .env 注入密钥（不入镜像）。
#   离线自检：   docker compose run --rm synapse
#   真实 signal：docker compose run --rm synapse signal --rounds 10
#   双模式 A/B： docker compose run --rm synapse ab --rounds 10 --config configs/default.yaml
services:
  synapse:
    build: .
    image: synapse:latest
    env_file:
      - path: .env          # 注入 PARATERA_API_KEY；缺省(离线 smoke)时不报错
        required: false
    command: ["smoke"]      # 默认离线自检；run 时可覆盖为 signal/ab/probe
