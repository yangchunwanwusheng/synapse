name: 实验任务
description: 规划可复现、可证伪的性能或质量实验
title: "[Experiment] "
labels: ["experiment", "triage"]
body:
  - type: textarea
    id: claim
    attributes:
      label: 待验证 Claim
      description: 用一句可证伪的话描述本实验要支持或否定的结论。
    validations:
      required: true
  - type: textarea
    id: design
    attributes:
      label: 实验设计
      description: 说明基线、处理组、数据集、样本量、seed、控制变量与停止规则。
    validations:
      required: true
  - type: textarea
    id: metrics
    attributes:
      label: 指标与判据
      description: 预先写明主指标、质量护栏、统计方法和通过阈值。
    validations:
      required: true
  - type: textarea
    id: artifacts
    attributes:
      label: 产物要求
      description: 列出配置快照、原始逐项结果、聚合表、图表和复现命令的预期路径。
    validations:
      required: true

