name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python ${{ matrix.python-version }} quality gates
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    defaults:
      run:
        working-directory: 源代码及readme文档
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.5"
          python-version: ${{ matrix.python-version }}
          enable-cache: true
          cache-dependency-glob: 源代码及readme文档/uv.lock

      - name: Sync locked dependencies
        run: uv sync --locked --extra dev --no-editable

      - name: Lint
        run: uv run --no-sync ruff check .

      - name: Test
        run: uv run --no-sync pytest -q

      - name: Offline acceptance smoke
        run: uv run --no-sync synapse smoke

      - name: Build package
        run: uv build

  openeuler-container:
    name: openEuler 24.03-LTS-SP3 container smoke
    needs: quality
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: 源代码及readme文档
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build openEuler image
        run: docker build --tag synapse-ci:${{ github.sha }} .

      - name: Run offline acceptance smoke
        run: docker run --rm synapse-ci:${{ github.sha }}
