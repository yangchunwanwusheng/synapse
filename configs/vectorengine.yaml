# VectorEngine 平台配置（OpenAI 兼容聚合平台）
# 模型广场: https://api.vectorengine.ai/pricing
# 实测连通: chat qwen3-235b-a22b-instruct-2507 ✓; embedding text-embedding-3-small (dim=1536) ✓

llm_backend: vectorengine       # OpenAIServerModel 走 paratera 分支（OpenAI 兼容，同代码路径）
embedder: api                   # 真实句向量（ApiEmbedder）
api_base: https://api.vectorengine.cn/v1
api_key_env: VECTORENGINE_API_KEY
model: qwen3-235b-a22b-instruct-2507   # MoE 22B 激活 + Instruct（非 thinking），CodeAct 友好
embed_model: text-embedding-3-small    # dim=1536，触发残差编码双字节索引路径（覆盖骨架 64 维）
temperature: 0.0                # 复现性：固定 0
