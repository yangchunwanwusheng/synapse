[project]
name = "synapse-mas"
version = "0.1.0"
description = "SYNAPSE — Coordination as Compression：多智能体低开销通信/非文本状态传递/共享记忆原型"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["smolagents>=1.26"]   # 基座：轻依赖 agent 运行时（CodeAct=M11）；离线 mock 仍零网络

[project.optional-dependencies]
api = ["openai>=1.40"]                                   # Paratera 真实 LLM（smolagents.OpenAIServerModel，OpenAI 兼容）
vector = ["faiss-cpu>=1.8"]                              # 向量检索
config = ["omegaconf>=2.3", "pyyaml>=6.0"]              # YAML 配置覆盖
viz = ["matplotlib>=3.8"]                               # 实验报告作图（收缩曲线）
dev = ["pytest>=8.0", "ruff>=0.6", "python-docx>=1.1", "python-pptx>=0.6"]   # + docs/final 材料改口/验收脚本依赖（V3-01 构建链）

[project.scripts]
synapse = "synapse.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/synapse"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
src = ["src"]
